apiVersion: v1
kind: Service
metadata:
  name: botforge-app
  namespace: botforge
  labels:
    app: botforge
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: botforge
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: botforge-app
  namespace: botforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: botforge-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: botforge-app
  namespace: botforge
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: botforge
